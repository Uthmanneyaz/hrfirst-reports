:root{--ease:cubic-bezier(0.23,1,0.32,1);--grad:linear-gradient(135deg,#D8F3EC 0%,#CFE0F4 22%,#C9CCF5 45%,#E3D4F0 62%,#F3D9EA 78%,#E4F7F0 100%);
--ink:#000;--body:#1A1A1A;--mut:#666;--hair:#E5E5E5;--ok:#3E8E7E;--warn:#C99A3B;--err:#C0553B;--info:#5B6BB0}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Thmanyah Sans',system-ui,sans-serif}
html,body{background:#FAFAFA;color:var(--body)}
button{background:none;border:none;cursor:pointer;font-family:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.view{display:none;animation:vin .28s var(--ease)}
.view.on{display:block}
#home{min-height:100vh;background:var(--grad);background-size:180% 180%;animation:gradShift 26s ease-in-out infinite alternate;padding:64px 24px;position:relative;overflow:hidden}
#home::before,#home::after{content:'';position:absolute;inset:-20%;pointer-events:none}
#home::before{background:radial-gradient(46% 38% at 22% 24%,rgba(216,243,236,.9),transparent 70%),radial-gradient(42% 40% at 80% 18%,rgba(201,204,245,.75),transparent 70%),radial-gradient(48% 44% at 76% 82%,rgba(243,217,234,.8),transparent 70%),radial-gradient(40% 36% at 18% 80%,rgba(228,247,240,.85),transparent 70%);animation:drift 18s ease-in-out infinite alternate}
#home::after{background:radial-gradient(30% 26% at 50% 55%,rgba(255,255,255,.5),transparent 75%)}
@keyframes drift{from{transform:translate3d(-2%,-1.5%,0) scale(1)}to{transform:translate3d(2%,1.5%,0) scale(1.05)}}
@keyframes gradShift{from{background-position:0% 0%}to{background-position:100% 100%}}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;pointer-events:none}
.b1{width:340px;height:340px;background:#C9CCF5;top:-80px;left:-60px;animation:drift 22s ease-in-out infinite alternate}
.b2{width:300px;height:300px;background:#F3D9EA;bottom:-90px;right:-70px;animation:drift 28s ease-in-out infinite alternate-reverse}
.b3{width:260px;height:260px;background:#D8F3EC;top:40%;left:60%;animation:drift 34s ease-in-out infinite alternate}
@media(prefers-reduced-motion:reduce){#home{animation:none}.blob{animation:none}}
@media(prefers-reduced-motion:reduce){#home::before{animation:none}}
#home>*:not(.blob){position:relative;z-index:1}
#home.on{display:flex;flex-direction:column;align-items:center;justify-content:center}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.view{animation:vfade .2s ease}@keyframes vfade{from{opacity:0}to{opacity:1}}.card,.stagger>*{animation:none!important}}
#home .logo svg{height:30px;width:auto}
#home h1{font-weight:300;font-size:clamp(28px,5vw,44px);letter-spacing:.12em;color:var(--ink);margin:28px 0 14px;text-align:center}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border-radius:8px;padding:10px 20px;letter-spacing:.06em;font-weight:500;font-size:13px}
#home .lead{margin-top:44px;font-size:13px;color:var(--body);letter-spacing:.08em}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;max-width:1240px;width:100%;margin-top:24px}
@media(min-width:1150px){.cards{grid-template-columns:repeat(5,1fr)}}
.card{background:rgba(255,255,255,.55);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:none;border-radius:16px;padding:24px;text-align:right;box-shadow:0 1px 2px rgba(0,0,0,.03),0 12px 32px rgba(0,0,0,.07);transition:transform .2s var(--ease),box-shadow .2s var(--ease),background .2s ease;opacity:0;animation:up .34s var(--ease) forwards}
@keyframes up{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.card:nth-child(1){animation-delay:.04s}.card:nth-child(2){animation-delay:.09s}.card:nth-child(3){animation-delay:.14s}.card:nth-child(4){animation-delay:.19s}.card:nth-child(5){animation-delay:.24s}
.card{position:relative;overflow:visible;cursor:pointer}
@media(hover:hover) and (pointer:fine){
.card:hover{transform:translateY(-5px) scale(1.03);background:rgba(255,255,255,.68);box-shadow:0 6px 12px rgba(0,0,0,.05),0 24px 48px rgba(0,0,0,.11)}}
.card:active{transform:translateY(-2px) scale(1.01)}
.card .pop{position:absolute;bottom:calc(100% + 10px);right:50%;transform:translate(50%,6px) scale(.96);z-index:10;
 background:rgba(255,255,255,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
 border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,.06),0 14px 34px rgba(0,0,0,.12);
 padding:12px 18px;display:flex;gap:18px;white-space:nowrap;font-size:11px;color:var(--mut);
 opacity:0;pointer-events:none;transition:opacity .2s var(--ease),transform .2s var(--ease)}
.card .pop b{display:block;color:var(--ink);font-weight:500;font-size:15px;margin-bottom:2px;text-align:center}
@media(hover:hover) and (pointer:fine){.card:hover .pop{opacity:1;transform:translate(50%,0) scale(1)}}
.cards{overflow:visible}


.card .blogo{height:60px;margin-bottom:14px;display:flex;justify-content:center}
.card .blogo img{height:60px;width:120px;object-fit:contain;object-position:center center}
.card h3{font-weight:400;font-size:15px;color:var(--ink);letter-spacing:.03em;text-align:center}
.card .m{margin-top:12px;font-size:11.5px;color:var(--mut);line-height:1.9;text-align:center;white-space:nowrap}
.card .m b{color:var(--ink);font-weight:500}
.card .clean{margin-top:12px;font-size:12px;color:var(--ok);text-align:center}
#branch{position:relative;min-height:100vh;overflow:hidden;background:
 radial-gradient(900px 420px at 85% -80px,rgba(201,204,245,.5),transparent 70%),
 radial-gradient(700px 380px at 8% -60px,rgba(216,243,236,.55),transparent 70%),
 radial-gradient(760px 400px at 55% -100px,rgba(243,217,234,.4),transparent 72%),
 #FAFAFA}
#branch::before{content:'';position:absolute;inset:-10%;pointer-events:none;
 background:radial-gradient(30% 22% at 15% 70%,rgba(216,243,236,.4),transparent 70%),
 radial-gradient(26% 20% at 88% 55%,rgba(243,217,234,.32),transparent 70%),
 radial-gradient(24% 18% at 60% 90%,rgba(201,204,245,.3),transparent 70%);
 animation:drift 30s ease-in-out infinite alternate}
@media(prefers-reduced-motion:reduce){#branch::before{animation:none}}
#branch .inner{position:relative;max-width:1080px;margin:0 auto;padding:40px 24px 80px}

.topbar{display:flex;align-items:center;gap:16px;margin-bottom:40px;flex-wrap:wrap}
.back{border:none;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 16px rgba(0,0,0,.06);border-radius:8px;padding:9px 16px;font-size:13px;transition:transform .15s var(--ease)}
@media(hover:hover) and (pointer:fine){.back:hover{transform:translateX(3px)}}
.topbar .blogo img{height:48px;width:96px;object-fit:contain;object-position:center center}
.topbar h2{font-weight:300;font-size:26px;letter-spacing:.1em;color:var(--ink);flex:1}
.topbar .logo svg{height:22px;opacity:.9}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:48px}
.kpi{background:#fff;border:none;border-radius:16px;padding:24px;position:relative;box-shadow:0 1px 2px rgba(0,0,0,.03),0 10px 30px rgba(0,0,0,.06)}
.kpi .v{font-weight:300;font-size:34px;color:var(--ink);letter-spacing:.02em}
.kpi .l{font-size:12.5px;color:var(--mut);letter-spacing:.04em;margin-top:6px;line-height:1.6}
.kpi .i{position:absolute;top:14px;left:14px;width:20px;height:20px;border:none;box-shadow:0 1px 3px rgba(0,0,0,.08);border-radius:50%;font-size:11px;color:var(--mut);display:flex;align-items:center;justify-content:center;transition:background .15s ease}
.kpi .i:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.tip{position:absolute;top:40px;left:0;z-index:5;width:260px;background:var(--ink);color:#fff;border-radius:12px;padding:14px 16px;font-size:12px;line-height:1.9;font-weight:300;opacity:0;pointer-events:none;transform:translateY(-4px) scale(.97);transform-origin:top left;transition:opacity .18s var(--ease),transform .18s var(--ease)}
.kpi .i:hover+.tip,.kpi .i:focus+.tip{opacity:1;transform:none}
.sec{margin-bottom:48px}
.sec>.pill{margin-bottom:20px}
.emp{background:#fff;border:none;border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.03),0 10px 30px rgba(0,0,0,.06);padding:20px 24px;margin-bottom:12px;display:grid;grid-template-columns:12px 190px 1fr 300px;gap:16px;align-items:center;transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
@media(max-width:820px){.emp{grid-template-columns:12px 1fr;row-gap:12px}.emp>*{grid-column:2}.emp .dot{grid-column:1;grid-row:1;margin-top:6px}.emp .stats{justify-content:flex-start;grid-template-columns:repeat(3,minmax(70px,1fr))}.emp .act{border:none;padding:0}}
@media(hover:hover) and (pointer:fine){.emp:hover{transform:translateY(-2px);box-shadow:0 4px 8px rgba(0,0,0,.05),0 16px 36px rgba(0,0,0,.09)}}
.stagger>*{opacity:0;animation:up .3s var(--ease) forwards}
.stagger>*:nth-child(1){animation-delay:.03s}.stagger>*:nth-child(2){animation-delay:.08s}.stagger>*:nth-child(3){animation-delay:.13s}.stagger>*:nth-child(4){animation-delay:.18s}.stagger>*:nth-child(5){animation-delay:.23s}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.d1{background:var(--err)}.d2{background:var(--warn)}.d3{background:var(--info)}.d4{background:var(--ok)}
.emp .who b{font-weight:500;color:var(--ink);font-size:14.5px}
.emp .who span{display:block;font-size:12px;color:var(--mut);margin-top:3px}
.emp .stats{display:grid;grid-template-columns:repeat(3,96px);justify-content:center;gap:10px;font-size:11.5px;color:var(--mut);text-align:center}
.emp .stats>div{white-space:nowrap}
.emp .stats b{display:block;color:var(--ink);font-weight:400;font-size:17px;margin-bottom:2px}
.emp .act{max-width:300px;font-size:12px;color:var(--body);line-height:1.8;border-right:1px solid var(--hair);padding-right:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;align-items:center}
.chip{border:none;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.05);border-radius:8px;padding:8px 16px;font-size:12.5px;letter-spacing:.04em;color:var(--body);transition:background .15s ease,color .15s ease,transform .12s var(--ease)}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:500}
select{border:none;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.05);border-radius:8px;padding:8px 14px;font-size:13px;font-family:inherit;color:var(--body)}
.tblwrap{background:#fff;border:none;border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.03),0 10px 30px rgba(0,0,0,.06)}
.tscroll{max-height:480px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{position:sticky;top:0;background:#fff;padding:14px 10px;font-weight:500;color:var(--ink);font-size:12px;letter-spacing:.05em;border-bottom:1px solid #F0F0F0;cursor:pointer;white-space:nowrap;text-align:center}
td{padding:12px 10px;border-bottom:1px solid #F0F0F0;text-align:center;color:var(--body)}
tr:last-child td{border-bottom:none}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap}
.st i{width:7px;height:7px;border-radius:50%;display:inline-block}
.cnt{font-size:12px;color:var(--mut);padding:12px 16px;border-top:1px solid #F2F2F2}
.short{color:var(--err);font-weight:500}.unc{color:var(--warn)}
/* export panel */
.xpanel{background:#fff;border:none;border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.03),0 10px 30px rgba(0,0,0,.06);padding:24px;margin-bottom:20px;display:none}
.xpanel.on{display:block;animation:vin .22s var(--ease)}
.xpanel .cols{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 20px}
.xpanel label.c{border:none;box-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.05);border-radius:8px;padding:7px 14px;font-size:12.5px;cursor:pointer;user-select:none;transition:background .15s ease,color .15s ease}
.xpanel label.c.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.xpanel input{display:none}
.xnote{font-size:12px;color:var(--mut);line-height:1.8}

@media(max-width:640px){
 #home{padding:40px 16px}
 #home h1{letter-spacing:.08em}
 #branch .inner{padding:24px 14px 60px}
 .topbar{gap:10px;margin-bottom:24px}
 .topbar h2{font-size:20px}
 .topbar .logo{display:none}
 .kpis{grid-template-columns:1fr 1fr;gap:10px;margin-bottom:32px}
 .kpi{padding:16px}.kpi .v{font-size:26px}
 .emp{padding:16px}
 .emp .stats{grid-template-columns:repeat(3,1fr);gap:6px;font-size:10.5px}
 .emp .act{max-width:none}
 table{min-width:760px}
 .tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
 .sec{margin-bottom:32px}
}

const STS=[...new Set(DATA.map(r=>r.st))];
const STC=s=>s.startsWith('حضور')?'var(--ok)':s==='غياب'?'var(--err)':s==='تسجيل ناقص'?'var(--warn)':s.startsWith('إجازة')||s==='رحلة عمل'?'var(--info)':'#bbb';
let cur=null,f={st:new Set(),emp:'',d1:1,d2:31},sortK='day',sortA=true;
const $=id=>document.getElementById(id);
const fmt=n=>(Math.round(n*100)/100).toLocaleString('en-US');

function agg(rows){const per={};rows.forEach(r=>{const p=per[r.emp]=per[r.emp]||{job:r.job,abs:0,short:0,unconf:0,miss:0,att:0,noP:false,remote:false};
 if(r.st==='غياب')p.abs++;if(r.st==='تسجيل ناقص')p.miss++;if(r.st.startsWith('حضور'))p.att++;
 p.short+=r.short;p.unconf+=r.unconf;
 if(r.note.includes('لا يوجد أي تسجيل بصمة'))p.noP=true;
 if(r.st==='غير مسجل')p.remote=true;if(r.note.includes('غير مطالب بالبصمة'))p.free=true;});return per;}

BRS.forEach(b=>{
 const rows=DATA.filter(r=>r.br===b);
 const short=rows.reduce((a,r)=>a+r.short,0);
 const c=document.createElement('button');c.className='card';
 const per=agg(rows);const nEmp=Object.keys(per).length;
 const att=rows.filter(r=>r.st.startsWith('حضور')).length, sched=rows.filter(r=>r.req>0).length;
 const absD=rows.filter(r=>r.st==='غياب').length;
 const pct=sched?Math.round(att/sched*100)+'%':'·';
 c.innerHTML=`<div class="pop"><div><b class="num">${nEmp}</b>موظفين</div><div><b class="num">${pct}</b>نسبة الحضور</div><div><b class="num">${absD}</b>غياب يوم</div></div>`+
  `<div class="blogo"><img src="data:image/png;base64,${BLOGOS[b]}" alt=""></div><h3>${b}</h3>`+
  (short>0?`<div class="m">ساعات العمل الناقصة: <b class="num">${fmt(short)}</b> ساعة</div>`
   :`<div class="clean">لا نقص هذا الشهر</div>`);
 c.onclick=()=>openBranch(b);$('brCards').appendChild(c);
});
function goHome(){$('branch').classList.remove('on');$('home').classList.add('on');window.scrollTo(0,0);}
function openBranch(b){cur=b;f={st:new Set(),emp:'',d1:1,d2:31};sortK='day';sortA=true;
 $('home').classList.remove('on');$('branch').classList.add('on');window.scrollTo(0,0);
 $('brTitle').textContent=b.replace('جمعية ','');
 $('brLogo').innerHTML=`<img src="data:image/png;base64,${BLOGOS[b]}" alt="">`;
 $('xpanel').classList.remove('on');buildFilters();buildCols();render();countUp();}
function buildFilters(){
 const rows=DATA.filter(r=>r.br===cur);
 $('stChips').innerHTML='';[...new Set(rows.map(r=>r.st))].forEach(s=>{
  const b=document.createElement('button');b.className='chip';b.textContent=s;
  b.onclick=()=>{f.st.has(s)?f.st.delete(s):f.st.add(s);b.classList.toggle('on');render();};$('stChips').appendChild(b);});
 const sel=$('empSel');sel.innerHTML='<option value="">كل الموظفين</option>';
 [...new Set(rows.map(r=>r.emp))].forEach(e=>sel.add(new Option(e,e)));
 sel.onchange=()=>{f.emp=sel.value;render();};
 const days=[...new Set(rows.map(r=>r.day))].sort((a,b)=>a-b);
 [['dFrom',days[0]],['dTo',days[days.length-1]]].forEach(([id,def])=>{const s=$(id);s.innerHTML='';
  days.forEach(d=>s.add(new Option((id==='dFrom'?'من ':'إلى ')+d+' يوليو',d)));s.value=def;
  s.onchange=()=>{f.d1=+$('dFrom').value;f.d2=+$('dTo').value;render();};});
 f.d1=days[0];f.d2=days[days.length-1];
}
function resetF(){buildFilters();f.st.clear();f.emp='';render();}
function match(r){if(f.st.size&&!f.st.has(r.st))return false;if(f.emp&&r.emp!==f.emp)return false;
 return r.day>=Math.min(f.d1,f.d2)&&r.day<=Math.max(f.d1,f.d2);}

const COLS=[['emp','الموظف'],['job','الوظيفة'],['day','اليوم'],['dn','يوم الأسبوع'],['shift','المناوبة'],['req','المطلوب'],['tin','دخول'],['tout','خروج'],['worked','ساعات العمل'],['leave','مغادرة معتمدة'],['st','الحالة'],['short','النقص'],['unconf','ساعات معلقة'],['note','ملاحظة']];
const TCOLS=COLS.filter(c=>!['job','shift','req'].includes(c[0]));
let xsel=new Set(COLS.map(c=>c[0]));
function buildCols(){$('xcols').innerHTML='';COLS.forEach(c=>{
 const l=document.createElement('label');l.className='c on';l.textContent=c[1];
 l.onclick=()=>{xsel.has(c[0])?xsel.delete(c[0]):xsel.add(c[0]);l.classList.toggle('on');};$('xcols').appendChild(l);});
 xsel=new Set(COLS.map(c=>c[0]));}
function cellVal(r,k){
 if(k==='day')return r.day+' يوليو';
 if(k==='worked')return r.worked!=null?fmt(r.worked):'';
 if(k==='leave')return r.leave?fmt(r.leave):'';
 if(k==='short')return r.short?fmt(r.short):'';
 if(k==='unconf')return r.unconf?fmt(r.unconf):'';
 return r[k]??'';}
function exportX(kind){
 const rows=[...DATA.filter(r=>r.br===cur&&match(r))].sort((a,b)=>a.day-b.day||a.emp.localeCompare(b.emp));
 const cols=COLS.filter(c=>xsel.has(c[0]));
 if(kind==='xlsx'){
  const aoa=[cols.map(c=>c[1])].concat(rows.map(r=>cols.map(c=>cellVal(r,c[0]))));
  const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=cols.map(()=>({wch:16}));
  const wb=XLSX.utils.book_new();wb.Workbook={Views:[{RTL:true}]};
  XLSX.utils.book_append_sheet(wb,ws,'السجل اليومي');
  XLSX.writeFile(wb,`سجل الحضور ${cur} يوليو 2026.xlsx`);

  <h1>سجل الحضور والانصراف · ${cur}</h1><div class="sub">يوليو 2026 · المصدر ZenHR · ${rows.length} سجل</div>
  <table><thead><tr>${cols.map(c=>'<th>'+c[1]+'</th>').join('')}</tr></thead><tbody>
  ${rows.map(r=>'<tr>'+cols.map(c=>'<td>'+(cellVal(r,c[0])||'·')+'</td>').join('')+'</tr>').join('')}
  </tbody></table><script>window.print()<\/script></body></html>`);
  w.document.close();
 }
}
function render(){
 const rows=DATA.filter(r=>r.br===cur&&match(r));
 const short=rows.reduce((a,r)=>a+r.short,0),unc=rows.reduce((a,r)=>a+r.unconf,0);
 const att=rows.filter(r=>r.st.startsWith('حضور')).length;
 const sched=rows.filter(r=>r.req>0).length;
 const pct=sched?Math.round(att/sched*100):null;
 const K=[
  [fmt(short),'إجمالي ساعات العمل الناقصة','مجموع الساعات التي كان يفترض أن تُعمل ولم تُعمل، بعد حسم كل الأعذار المعتمدة: المغادرات، الإجازات، رحلات العمل. يوم الغياب الكامل يدخل هنا بكامل ساعاته المطلوبة.'],
  [fmt(unc),'ساعات معلقة، بصمة غير مكتملة','هذه ساعات وليست عدد حركات: مجموع الساعات المطلوبة في الأيام التي سجل فيها الموظف دخولًا بلا خروج. مثال: يوم واحد بمناوبة 6 ساعات وفيه دخول بلا خروج = 6 ساعات معلقة. لا نحسبها نقصًا حتى تُراجع يدويًا.'],
  [pct!=null?pct+'%':'·','نسبة أيام الحضور','عدد الأيام التي حضر فيها الموظفون فعليًا مقسومًا على أيام العمل المطلوبة منهم. الإجازات ورحلات العمل والعطل لا تدخل في المطلوب أصلًا، فلا تنقص النسبة. مثال: 18 يوم حضور من 20 يومًا مطلوبًا = 90%.']];
 $('kpis').innerHTML=K.map(k=>`<div class="kpi"><div class="v num" data-t="${k[0]}">${k[0]}</div><div class="l">${k[1]}</div>
  <button class="i">؟</button><div class="tip">${k[2]}</div></div>`).join('');
 const per=agg(DATA.filter(r=>r.br===cur));
 const list=Object.entries(per).map(([e,p])=>({e,...p}));
 list.forEach(p=>{
  if(p.free){p.sev=4;p.act='يعمل عن بعد وغير مطالب بالبصمة. لا يحسب عليه شيء.';}
  else if(p.remote){p.sev=3;p.act='يعمل عن بعد والمطلوب بصمة يوم الجمعة حضوريًا فقط. أيام الجمعة غير مسجلة في ZenHR، تحتاج تحققًا يدويًا.';}
  else if(p.noP){p.sev=1;p.act='لا بصمة طوال الشهر. تأكدوا أولًا: هل هو مطالب بالبصمة؟ إن كان مطالبًا فهذه أولى الحالات.';}
  else if(p.abs>=5){p.sev=1;p.act='غياب متكرر بلا عذر. اجتماع مباشر وتفسير مكتوب قبل أي خصم.';}
  else if(p.short>=10){p.sev=2;p.act='نقص ملموس رغم الحضور. مراجعة أوقات الدخول والخروج معه.';}
  else if(p.unconf>=6||p.miss>=3){p.sev=3;p.act='ينسى بصمة الخروج. تنبيه ودي وتفعيل إشعار التطبيق.';}
  else if(p.short>=1){p.sev=3;p.act='نقص بسيط. تنبيه لطيف يكفي.';}
  else{p.sev=4;p.act='ملتزم. لا إجراء.';}});
 const isCEO=p=>/تنفيذي/.test(p.job)&&/(رئيس|مدير)/.test(p.job);
 list.sort((a,b)=>(isCEO(b)-isCEO(a))||a.sev-b.sev||b.short-a.short||b.unconf-a.unconf);
 $('prios').innerHTML=list.map(p=>`<div class="emp"><span class="dot d${p.sev}"></span>
  <div class="who"><b>${p.e}</b><span>${p.job}</span></div>
  <div class="stats"><div><b class="num">${fmt(p.short)}</b>نقص · ساعة</div><div><b class="num">${p.abs}</b>غياب · يوم</div><div><b class="num">${p.miss}</b>بصمة غير مكتملة · يوم</div></div>
  <div class="act">${p.act}</div></div>`).join('');
 document.querySelector('#tbl thead').innerHTML='<tr>'+TCOLS.map(c=>`<th onclick="setSort('${c[0]}')">${c[1]}${sortK===c[0]?(sortA?' ▲':' ▼'):''}</th>`).join('')+'</tr>';
 const sorted=[...rows].sort((a,b)=>{let x=a[sortK]??-1,y=b[sortK]??-1;return (x>y?1:x<y?-1:0)*(sortA?1:-1);});
 document.querySelector('#tbl tbody').innerHTML=sorted.map(r=>`<tr>
  <td>${r.emp}</td><td class="num">${r.day} يوليو</td><td style="color:var(--mut);font-size:11px">${r.dn}</td>
  <td class="num">${r.tin||'·'}</td><td class="num">${r.tout||'·'}</td>
  <td class="num">${r.worked!=null?fmt(r.worked):'·'}</td><td class="num">${r.leave?fmt(r.leave):'·'}</td>
  <td><span class="st"><i style="background:${STC(r.st)}"></i>${r.st}</span></td>
  <td class="num ${r.short?'short':''}">${r.short?fmt(r.short):'·'}</td>
  <td class="num ${r.unconf?'unc':''}">${r.unconf?fmt(r.unconf):'·'}</td>
  <td style="font-size:11px;color:var(--mut)">${r.note||''}</td></tr>`).join('');
 $('cnt').textContent=sorted.length+' سجل';
}
function setSort(k){if(sortK===k)sortA=!sortA;else{sortK=k;sortA=true;}render();}
const rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
function countUp(){if(rm)return;document.querySelectorAll('.kpi .v').forEach(el=>{
 const t=el.dataset.t;const m=t&&t.match(/^([\d,\.]+)(%?)$/);if(!m)return;
 const target=parseFloat(m[1].replace(/,/g,''));const suf=m[2];const dec=(m[1].split('.')[1]||'').length;
 const t0=performance.now(),D=600;
 function step(now){const p=Math.min(1,(now-t0)/D);const e=1-Math.pow(1-p,3);
  el.textContent=(target*e).toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec})+suf;
  if(p<1)requestAnimationFrame(step);else el.textContent=t;}
 requestAnimationFrame(step);});}
</script></body></html>
